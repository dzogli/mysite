backend:
  name: github
  repo: dzogli/mysite
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Страницы"
    files:
      - file: "content.json"
        label: "Главная страница"
        name: "home"
        fields:
          - {label: "Заголовок", name: "title", widget: "string"}
          - {label: "Главное изображение", name: "image", widget: "image"}
          - {label: "Описание", name: "body", widget: "markdown"}
